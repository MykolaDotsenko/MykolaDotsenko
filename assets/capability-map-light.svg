<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Engineering capability map</title>
  <desc id="desc">Backend, frontend, data systems, and AI integrations connect into AgriTech decision software.</desc>
  <style>@media (prefers-reduced-motion: reduce) { .motion { display: none; } }</style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8FAF6"/><stop offset="1" stop-color="#EEF3EB"/></linearGradient>
    <filter id="glow" x="-300%" y="-300%" width="700%" height="700%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="clip"><rect x="18" y="18" width="1164" height="294" rx="26"/></clipPath>
  </defs>
  <rect x="18" y="18" width="1164" height="294" rx="26" fill="url(#bg)" stroke="#D7E0D3"/>
  <g clip-path="url(#clip)">
    <g stroke="#E2E8DE" stroke-width="1" opacity=".72">
      <path d="M56 76H1144M56 132H1144M56 188H1144M56 244H1144"/>
      <path d="M170 38V300M390 38V300M610 38V300M830 38V300M1050 38V300"/>
    </g>

    <text x="62" y="58" fill="#667268" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" letter-spacing="2.2">ENGINEERING MAP / FROM SYSTEMS TO DECISIONS</text>

    <rect x="60" y="88" width="230" height="82" rx="16" fill="#FFFFFF" stroke="#D7E0D3"/>
    <text x="80" y="116" fill="#6F8D61" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" letter-spacing="1.6">BACKEND</text>
    <text x="80" y="142" fill="#1C2722" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="17" font-weight="700">Python · Django · DRF</text>
    <text x="80" y="160" fill="#667268" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5">rules · APIs · reliability</text>

    <rect x="320" y="88" width="230" height="82" rx="16" fill="#FFFFFF" stroke="#D7E0D3"/>
    <text x="340" y="116" fill="#6F8D61" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" letter-spacing="1.6">FRONTEND</text>
    <text x="340" y="142" fill="#1C2722" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="17" font-weight="700">React · Next.js · TS</text>
    <text x="340" y="160" fill="#667268" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5">UI states · flows · localization</text>

    <rect x="60" y="196" width="230" height="82" rx="16" fill="#FFFFFF" stroke="#D7E0D3"/>
    <text x="80" y="224" fill="#6F8D61" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" letter-spacing="1.6">DATA SYSTEMS</text>
    <text x="80" y="250" fill="#1C2722" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="17" font-weight="700">PostgreSQL · SQL · ETL</text>
    <text x="80" y="268" fill="#667268" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5">identity · sync · validation</text>

    <rect x="320" y="196" width="230" height="82" rx="16" fill="#FFFFFF" stroke="#D7E0D3"/>
    <text x="340" y="224" fill="#6F8D61" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" letter-spacing="1.6">AI &amp; INTEGRATIONS</text>
    <text x="340" y="250" fill="#1C2722" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="17" font-weight="700">APIs · AI-enabled flows</text>
    <text x="340" y="268" fill="#667268" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5">automation · evidence · fallbacks</text>

    <path id="route1" d="M290 129C410 129 522 113 648 145" fill="none" stroke="#B6C6AF" stroke-width="2"/>
    <path id="route2" d="M550 129C604 129 630 137 680 153" fill="none" stroke="#B6C6AF" stroke-width="2"/>
    <path id="route3" d="M290 237C430 237 525 220 668 186" fill="none" stroke="#B6C6AF" stroke-width="2"/>
    <path id="route4" d="M550 237C610 237 644 218 696 192" fill="none" stroke="#B6C6AF" stroke-width="2"/>

    <rect x="704" y="92" width="430" height="180" rx="22" fill="#F5F8F2" stroke="#6F8D61" stroke-opacity=".65"/>
    <text x="732" y="122" fill="#55744A" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" letter-spacing="2">AGRITECH / DECISION SOFTWARE</text>
    <text x="732" y="158" fill="#1C2722" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="24" font-weight="760">Real data → useful action</text>
    <text x="732" y="190" fill="#445149" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="14">Production · Revenue · Operations · Finance</text>
    <text x="732" y="216" fill="#445149" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="14">Intelligence · Trade · explainable decisions</text>
    <path d="M732 238H1098" stroke="#B6C6AF" stroke-width="1.4"/>
    <text x="732" y="259" fill="#667268" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11.5" letter-spacing=".6">reliable state · clear UI · explicit evidence · measurable value</text>

    <circle class="motion" r="4" fill="#6E915F" filter="url(#glow)">
      <animateMotion dur="4.8s" repeatCount="indefinite"><mpath href="#route1"/></animateMotion>
    </circle>
    <circle class="motion" r="3.5" fill="#6E915F" opacity=".8">
      <animateMotion dur="5.6s" begin="-1.7s" repeatCount="indefinite"><mpath href="#route2"/></animateMotion>
    </circle>
    <circle class="motion" r="4" fill="#6E915F" filter="url(#glow)">
      <animateMotion dur="5.2s" begin="-2.3s" repeatCount="indefinite"><mpath href="#route3"/></animateMotion>
    </circle>
    <circle class="motion" r="3.5" fill="#6E915F" opacity=".8">
      <animateMotion dur="4.6s" begin="-.8s" repeatCount="indefinite"><mpath href="#route4"/></animateMotion>
    </circle>
  </g>
</svg>