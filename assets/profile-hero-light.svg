<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Mykola Dotsenko — Software Engineer</title>
  <desc id="desc">Nordic editorial profile banner with a technical data path flowing into agricultural field contours.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F9FAF6"/>
      <stop offset="1" stop-color="#EEF2EA"/>
    </linearGradient>
    <radialGradient id="fieldGlow" cx="82%" cy="34%" r="58%">
      <stop offset="0" stop-color="#C9D9BE" stop-opacity=".72"/>
      <stop offset=".52" stop-color="#DDE6D7" stop-opacity=".28"/>
      <stop offset="1" stop-color="#F6F7F2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#94AA87" stop-opacity=".2"/>
      <stop offset=".35" stop-color="#7B956E"/>
      <stop offset="1" stop-color="#5E7B52"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#5B6B58" flood-opacity=".12"/>
    </filter>
    <filter id="nodeGlow" x="-300%" y="-300%" width="600%" height="600%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="cardClip"><rect x="18" y="18" width="1164" height="324" rx="28"/></clipPath>
  </defs>

  <rect x="18" y="18" width="1164" height="324" rx="28" fill="url(#bg)" filter="url(#softShadow)"/>
  <rect x="18.5" y="18.5" width="1163" height="323" rx="27.5" fill="none" stroke="#D9E1D4"/>

  <g clip-path="url(#cardClip)">
    <rect x="620" y="-20" width="620" height="430" fill="url(#fieldGlow)"/>

    <g stroke="#DDE4D9" stroke-width="1" opacity=".82">
      <path d="M52 72H1148M52 132H1148M52 192H1148M52 252H1148M52 312H1148"/>
      <path d="M172 40V332M392 40V332M612 40V332M832 40V332M1052 40V332"/>
    </g>

    <g fill="none" stroke="#AABD9F" stroke-width="1.35" opacity=".82">
      <path d="M741 330C768 298 803 284 842 266C894 242 923 207 950 170C982 126 1020 102 1070 88C1102 79 1133 77 1164 79"/>
      <path d="M782 345C812 313 850 296 891 276C941 252 974 221 1004 184C1038 143 1078 121 1127 112C1148 108 1167 107 1185 108"/>
      <path d="M701 307C728 275 756 252 795 230C838 206 864 176 889 139C918 96 949 71 995 52C1032 37 1071 32 1116 35"/>
      <path d="M668 280C699 245 726 218 758 189C790 160 812 127 831 91C851 55 874 31 905 12"/>
      <path d="M845 340C882 316 921 295 958 267C996 239 1027 208 1055 177C1090 138 1125 119 1172 113"/>
