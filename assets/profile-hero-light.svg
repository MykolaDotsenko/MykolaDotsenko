    <text x="731" y="286" fill="#2E3A32" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="14.5" font-weight="650">evidence before confidence</text>

    <text x="72" y="86" fill="#71806C" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="15.5" font-weight="750" letter-spacing="3.4">SOFTWARE ENGINEER · FINLAND</text>

    <text x="72" y="151" fill="#17212B" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="40" font-weight="760">
      <tspan x="72" dy="0">I build trustworthy software</tspan>
      <tspan x="72" dy="46">for messy reality.</tspan>
    </text>

    <text x="72" y="260" fill="#53606B" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="19.5">Python / Django · Data · Integrations · AgriTech</text>
    <text x="72" y="300" fill="#6A756C" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="16.5">Ukraine → Finland · agriculture &amp; business → software engineering</text>
