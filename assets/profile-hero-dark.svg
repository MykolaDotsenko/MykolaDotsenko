<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Mykola Dotsenko — Software Engineer</title>
  <desc id="desc">Nordic editorial banner highlighting backend, frontend, data, AI integrations and AgriTech with a subtle animated engineering signal.</desc>
  <style>
    @media (prefers-reduced-motion: reduce) { .motion { display: none; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C1116"/>
      <stop offset=".56" stop-color="#101713"/>
      <stop offset="1" stop-color="#111914"/>
    </linearGradient>
    <radialGradient id="fieldGlow" cx="84%" cy="31%" r="62%">
      <stop offset="0" stop-color="#7FA36B" stop-opacity=".29"/>
      <stop offset=".5" stop-color="#45603C" stop-opacity=".12"/>
      <stop offset="1" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9EB78E" stop-opacity=".30"/>
      <stop offset=".32" stop-color="#9EB78E"/>
      <stop offset=".68" stop-color="#B7D0A7"/>
      <stop offset="1" stop-color="#C7DDBA"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="22" flood-color="#000000" flood-opacity=".4"/>
    </filter>
    <filter id="nodeGlow" x="-350%" y="-350%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="2" seed="9" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .045"/></feComponentTransfer>
    </filter>
    <clipPath id="cardClip"><rect x="18" y="18" width="1164" height="324" rx="28"/></clipPath>
  </defs>

  <rect x="18" y="18" width="1164" height="324" rx="28" fill="url(#bg)" filter="url(#softShadow)"/>
  <rect x="18.5" y="18.5" width="1163" height="323" rx="27.5" fill="none" stroke="#27332A"/>

  <g clip-path="url(#cardClip)">
    <rect x="604" y="-30" width="660" height="440" fill="url(#fieldGlow)"/>
    <rect x="18" y="18" width="1164" height="324" filter="url(#grain)" opacity=".34"/>

    <g stroke="#263029" stroke-width="1" opacity=".84">
      <path d="M52 72H1148M52 132H1148M52 192H1148M52 252H1148M52 312H1148"/>
      <path d="M172 40V332M392 40V332M612 40V332M832 40V332M1052 40V332"/>
    </g>

    <g fill="none" stroke="#6F8C62" stroke-width="1.35" opacity=".65">
      <path d="M741 330C768 298 803 284 842 266C894 242 923 207 950 170C982 126 1020 102 1070 88C1102 79 1133 77 1164 79"/>
      <path d="M782 345C812 313 850 296 891 276C941 252 974 221 1004 184C1038 143 1078 121 1127 112C1148 108 1167 107 1185 108"/>
      <path d="M701 307C728 275 756 252 795 230C838 206 864 176 889 139C918 96 949 71 995 52C1032 37 1071 32 1116 35"/>
      <path d="M668 280C699 245 726 218 758 189C790 160 812 127 831 91C851 55 874 31 905 12"/>
      <path d="M845 340C882 316 921 295 958 267C996 239 1027 208 1055 177C1090 138 1125 119 1172 113"/>
    </g>

    <g opacity=".96">
      <path d="M678 96H1110" stroke="#52644D" stroke-width="2"/>
      <circle cx="700" cy="96" r="4.4" fill="#9EB78E"/>
      <circle cx="790" cy="96" r="4.4" fill="#9EB78E"/>
      <circle cx="885" cy="96" r="4.4" fill="#B7D0A7"/>
      <circle cx="968" cy="96" r="4.4" fill="#B7D0A7"/>
      <circle cx="1064" cy="96" r="4.4" fill="#C7DDBA"/>
      <text x="675" y="77" fill="#81917B" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="9.5" letter-spacing="1.15">BACKEND</text>
      <text x="760" y="77" fill="#81917B" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="9.5" letter-spacing="1.15">FRONTEND</text>
      <text x="866" y="77" fill="#94A88A" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="9.5" letter-spacing="1.15">DATA</text>
      <text x="951" y="77" fill="#9DB293" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="9.5" letter-spacing="1.15">AI</text>
      <text x="1027" y="77" fill="#A9BE9E" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="9.5" letter-spacing="1.15">AGRITECH</text>
    </g>

    <path id="signalPath" d="M678 96C744 116 777 149 820 177C861 204 904 208 946 186C987 164 1017 128 1058 112C1085 102 1110 106 1138 122" fill="none" stroke="url(#signal)" stroke-width="3.1" stroke-linecap="round"/>
    <circle cx="820" cy="177" r="4.8" fill="#9EB78E"/>
    <circle cx="946" cy="186" r="5.8" fill="#B7D0A7" filter="url(#nodeGlow)">
      <animate class="motion" attributeName="r" values="4.9;7.1;4.9" dur="3.2s" repeatCount="indefinite"/>
      <animate class="motion" attributeName="opacity" values=".72;1;.72" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1058" cy="112" r="4.8" fill="#C7DDBA"/>

    <circle class="motion" r="3.5" fill="#C7DDBA" filter="url(#nodeGlow)" opacity=".92">
      <animateMotion dur="5.8s" repeatCount="indefinite"><mpath href="#signalPath"/></animateMotion>
    </circle>
    <circle class="motion" r="2.8" fill="#B7D0A7" opacity=".65">
      <animateMotion dur="5.8s" begin="-2.7s" repeatCount="indefinite"><mpath href="#signalPath"/></animateMotion>
    </circle>

    <rect x="704" y="238" width="300" height="62" rx="14" fill="#111A13" fill-opacity=".90" stroke="#354433"/>
    <text x="722" y="261" fill="#83967B" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10.5" letter-spacing="1.5">ENGINEERING SIGNAL</text>
    <text x="722" y="285" fill="#D7E2D1" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="14.5" font-weight="650">reliable systems → useful decisions</text>

    <text x="72" y="86" fill="#9EB78E" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="15.5" font-weight="750" letter-spacing="3.4">SOFTWARE ENGINEER · FINLAND</text>

    <text x="72" y="151" fill="#F3F5EF" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="40" font-weight="760">
      <tspan x="72" dy="0">I build trustworthy software</tspan>
      <tspan x="72" dy="46">for messy reality.</tspan>
    </text>

    <text x="72" y="260" fill="#C1C9CE" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="18.5">Python / Django · React / Next.js · Data · AI Integrations</text>
    <text x="72" y="300" fill="#909C93" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="16.3">backend depth · frontend delivery · AgriTech perspective</text>
  </g>
</svg>