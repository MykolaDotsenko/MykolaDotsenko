    <text x="731" y="266" fill="#83967B" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10.5" letter-spacing="1.5">ENGINEERING SIGNAL</text>
    <text x="731" y="286" fill="#D7E2D1" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="14.5" font-weight="650">evidence before confidence</text>

    <text x="72" y="86" fill="#9EB78E" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="15.5" font-weight="750" letter-spacing="3.4">SOFTWARE ENGINEER · FINLAND</text>

    <text x="72" y="151" fill="#F3F5EF" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="40" font-weight="760">
      <tspan x="72" dy="0">I build trustworthy software</tspan>
      <tspan x="72" dy="46">for messy reality.</tspan>
    </text>

    <text x="72" y="260" fill="#B7C0C5" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="19.5">Python / Django · Data · Integrations · AgriTech</text>
    <text x="72" y="300" fill="#909C93" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="16.5">Ukraine → Finland · agriculture &amp; business → software engineering</text>
