      <circle cx="724" cy="95" r="4.5" fill="#9EB78E"/>
      <circle cx="820" cy="95" r="4.5" fill="#9EB78E"/>
      <circle cx="929" cy="95" r="4.5" fill="#9EB78E"/>
      <circle cx="1032" cy="95" r="4.5" fill="#9EB78E"/>
      <text x="702" y="78" fill="#81917B" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10" letter-spacing="1.4">SOURCE</text>
      <text x="797" y="78" fill="#81917B" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10" letter-spacing="1.4">STATE</text>
      <text x="905" y="78" fill="#81917B" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10" letter-spacing="1.4">RULES</text>
      <text x="1010" y="78" fill="#81917B" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10" letter-spacing="1.4">ACTION</text>
    </g>

    <path d="M694 95C770 118 796 155 837 180C875 203 916 204 956 184C1001 162 1016 123 1054 108C1082 97 1109 101 1134 119" fill="none" stroke="url(#signal)" stroke-width="3.1" stroke-linecap="round"/>
    <circle cx="837" cy="180" r="5.5" fill="#B6D2A6" filter="url(#nodeGlow)">
      <animate attributeName="r" values="4.8;7.2;4.8" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".72;1;.72" dur="3.2s" repeatCount="indefinite"/>
    </circle>
