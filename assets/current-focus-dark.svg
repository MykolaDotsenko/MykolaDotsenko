<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="156" viewBox="0 0 1200 156" role="img" aria-labelledby="title desc">
  <title id="title">Current focus</title>
  <desc id="desc">Current focus: production software, MSc Software Engineering, AWS architecture, and Finnish language learning.</desc>
  <style>@media (prefers-reduced-motion: reduce) { .motion { display: none; } }</style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0E1418"/><stop offset="1" stop-color="#111914"/></linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9EB78E" stop-opacity="0"/><stop offset=".5" stop-color="#9EB78E" stop-opacity=".8"/><stop offset="1" stop-color="#9EB78E" stop-opacity="0"/></linearGradient>
    <clipPath id="clip"><rect x="18" y="18" width="1164" height="120" rx="22"/></clipPath>
  </defs>
  <rect x="18" y="18" width="1164" height="120" rx="22" fill="url(#bg)" stroke="#2B362F"/>
  <g clip-path="url(#clip)">
