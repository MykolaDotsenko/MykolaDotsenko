    <path d="M270 38V118M500 38V118M730 38V118M960 38V118" stroke="#344238" stroke-width="1"/>

    <text x="300" y="58" fill="#8E9A92" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10.5" letter-spacing="1.4">WORK</text>
    <text x="300" y="86" fill="#EDF2EC" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="17" font-weight="690">Production software</text>
    <text x="300" y="108" fill="#8E9A92" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5">backend · frontend · data</text>

    <text x="530" y="58" fill="#8E9A92" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10.5" letter-spacing="1.4">STUDY</text>
    <text x="530" y="86" fill="#EDF2EC" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="17" font-weight="690">MSc Software Engineering</text>
    <text x="530" y="108" fill="#8E9A92" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5">decision support · forecasting</text>

    <text x="760" y="58" fill="#8E9A92" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10.5" letter-spacing="1.4">CLOUD</text>
    <text x="760" y="86" fill="#EDF2EC" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="17" font-weight="690">AWS architecture</text>
    <text x="760" y="108" fill="#8E9A92" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5">Solutions Architect Associate</text>

    <text x="990" y="58" fill="#8E9A92" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10.5" letter-spacing="1.4">FINLAND</text>
