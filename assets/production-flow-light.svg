<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-labelledby="title desc">
  <title id="title">Production engineering flow</title>
  <desc id="desc">Messy inputs move through engineering rules and state handling into clear interfaces and useful outcomes.</desc>
  <style>@media (prefers-reduced-motion: reduce) { .motion { display:none; } }</style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAF6"/>
      <stop offset="1" stop-color="#EEF3EA"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6F8D61" stop-opacity=".12"/>
      <stop offset=".5" stop-color="#55744A" stop-opacity=".95"/>
      <stop offset="1" stop-color="#6F8D61" stop-opacity=".12"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#5C6A59" flood-opacity=".10"/>
    </filter>
    <filter id="glow" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect x="18" y="18" width="1164" height="234" rx="26"/></clipPath>
  </defs>

  <rect x="18" y="18" width="1164" height="234" rx="26" fill="url(#bg)" stroke="#D6DFD2" filter="url(#soft)"/>
  <g clip-path="url(#clip)">
    <g stroke="#E2E8DE" stroke-width="1" opacity=".70">
      <path d="M52 74H1148M52 128H1148M52 182H1148M52 236H1148"/>
      <path d="M170 36V246M390 36V246M610 36V246M830 36V246M1050 36V246"/>
    </g>

    <text x="58" y="54" fill="#68736B" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10.8" letter-spacing="2.3">PRODUCTION LENS / TURNING MESSY REALITY INTO USEFUL SOFTWARE</text>

    <rect x="58" y="78" width="312" height="140" rx="18" fill="#FFFFFF" stroke="#D6DFD2"/>
    <text x="82" y="107" fill="#6F8D61" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" letter-spacing="1.8">MESSY INPUTS</text>
    <text x="82" y="137" fill="#1B2621" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="19" font-weight="750">APIs · legacy systems</text>
    <text x="82" y="159" fill="#1B2621" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="19" font-weight="750">real users</text>
    <text x="82" y="185" fill="#68736B" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="11.5">stale data · duplicates · missing state</text>
    <text x="82" y="206" fill="#68736B" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="11.5">conflicting ownership · imperfect workflows</text>

    <rect x="444" y="78" width="312" height="140" rx="20" fill="#F4F7F1" stroke="#6F8D61" stroke-opacity=".62"/>
    <text x="468" y="107" fill="#55744A" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" letter-spacing="1.8">ENGINEERING</text>
    <text x="468" y="137" fill="#1B2621" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="20" font-weight="760">rules · state</text>
    <text x="468" y="159" fill="#1B2621" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="20" font-weight="760">evidence · UX</text>
    <text x="468" y="185" fill="#68736B" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="11.5">source of truth · retries · validation</text>
    <text x="468" y="206" fill="#68736B" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="11.5">loading/error states · fallbacks · observability</text>

    <rect x="830" y="78" width="312" height="140" rx="18" fill="#FFFFFF" stroke="#D6DFD2"/>
    <text x="854" y="107" fill="#6F8D61" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" letter-spacing="1.8">USEFUL OUTPUT</text>
    <text x="854" y="137" fill="#1B2621" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="19" font-weight="750">clear interfaces</text>
    <text x="854" y="159" fill="#1B2621" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="19" font-weight="750">reliable workflows</text>
    <text x="854" y="185" fill="#68736B" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="11.5">understandable state · safer decisions</text>
    <text x="854" y="206" fill="#68736B" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="11.5">software people can actually trust</text>

    <path id="flow1" d="M370 148C398 148 416 148 444 148" fill="none" stroke="#BCC9B6" stroke-width="2.4"/>
    <path id="flow2" d="M756 148C784 148 802 148 830 148" fill="none" stroke="#BCC9B6" stroke-width="2.4"/>

    <circle class="motion" r="4.5" fill="#6C925E" filter="url(#glow)">
      <animateMotion dur="3.6s" repeatCount="indefinite"><mpath href="#flow1"/></animateMotion>
    </circle>
    <circle class="motion" r="4.5" fill="#6C925E" filter="url(#glow)">
      <animateMotion dur="3.8s" begin="-1.4s" repeatCount="indefinite"><mpath href="#flow2"/></animateMotion>
    </circle>

    <rect class="motion" x="-260" y="244" width="260" height="2" fill="url(#beam)">
      <animate attributeName="x" values="-260;1200" dur="9s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>